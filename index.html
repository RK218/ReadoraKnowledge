<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readora Knowledge</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap');

:root{

    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#111827;
    --accent:#2563eb;
    --muted:#6b7280;
    --navbar:#ffffffea;
    --cardShadow:0 5px 20px rgba(0,0,0,0.06);
}

.dark-theme{

    --bg:#0f172a;
    --card:#111827;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --navbar:#111827ee;
    --cardShadow:0 5px 20px rgba(0,0,0,0.4);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
    scroll-padding-top:120px;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

.navbar{

    background:var(--navbar);

    backdrop-filter:blur(12px);

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    align-items:center;

    padding:18px 7%;

    position:sticky;

    top:0;

    z-index:100;
}

.logo{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;
    font-weight:700;
    color:var(--accent);
}

.nav-center{

    display:flex;
    justify-content:center;
    gap:28px;
}

.nav-center a{

    text-decoration:none;
    color:var(--muted);
    font-size:15px;
    transition:0.3s;
    position:relative;
}

.nav-center a:hover{
    color:var(--accent);
}

.active-nav{

    color:var(--accent) !important;
    font-weight:600;
}

.active-nav::after{

    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:100%;
    height:2px;
    background:var(--accent);
    border-radius:10px;
}

.theme-toggle{

    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
}

.switch{

    position:relative;
    display:inline-block;
    width:52px;
    height:28px;
}

.switch input{

    opacity:0;
    width:0;
    height:0;
}

.slider{

    position:absolute;
    cursor:pointer;
    inset:0;
    background:#cbd5e1;
    transition:.4s;
    border-radius:34px;
}

.slider:before{

    position:absolute;
    content:"";
    height:22px;
    width:22px;
    left:3px;
    bottom:3px;
    background:white;
    transition:.4s;
    border-radius:50%;
}

input:checked + .slider{
    background:#38bdf8;
}

input:checked + .slider:before{
    transform:translateX(24px);
}

.hero{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 7%;
}

.hero-content h1{

    font-family:'Cormorant Garamond',serif;
    font-size:110px;
    line-height:1;
    letter-spacing:3px;
    margin-bottom:20px;
}

.hero-content p{

    font-size:20px;
    color:var(--muted);
    max-width:700px;
    line-height:1.8;
    margin:auto;
}

.books-section{

    min-height:100vh;
    padding-top:120px;
}

.cart-section{

    min-height:100vh;
    padding-top:120px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.filters{

    width:86%;
    margin:20px auto;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.filters select{

    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    box-shadow:var(--cardShadow);
    font-size:14px;
}

.book-grid{

    width:86%;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
}

.book-card{

    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--cardShadow);
    transition:0.3s;
}

.book-card:hover{
    transform:translateY(-8px);
}

.book-card img{

    width:100%;
    height:250px;
    object-fit:cover;
}

.book-content{
    padding:18px;
}

.genre{

    display:inline-block;
    background:#eff6ff;
    color:var(--accent);
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:12px;
}

.book-content h3{

    margin-bottom:10px;
    font-size:20px;
}

.book-content p{

    color:var(--muted);
    font-size:14px;
    margin-bottom:12px;
    line-height:1.6;
}

.price{

    font-size:18px;
    font-weight:600;
    margin-bottom:14px;
}

.add-btn{

    width:auto;
    padding:10px 18px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
    font-size:14px;
}

.add-btn:hover{

    background:#15803d;
    transform:translateY(-2px);
}

.cart-box{

    width:86%;
    background:var(--card);
    border-radius:18px;
    padding:25px;
    box-shadow:var(--cardShadow);
}

.cart-header{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.cart-count{

    background:#111827;
    color:white;
    padding:6px 14px;
    border-radius:30px;
    font-size:13px;
}

.cart-item{

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    background:rgba(255,255,255,0.05);
    margin-top:12px;
    border-radius:14px;
}

.cart-left h4{
    margin-bottom:4px;
}

.cart-left p{

    color:var(--muted);
    font-size:13px;
}

.qty-controls{

    display:flex;
    align-items:center;
    gap:10px;
}

.qty-btn{

    width:30px;
    height:30px;
    border:none;
    border-radius:8px;
    background:#111827;
    color:white;
    cursor:pointer;
}

.total-box{

    margin-top:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.checkout-btn{

    padding:12px 20px;
    background:#16a34a;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:600;
    cursor:pointer;
}

.explore-btn{

    padding:12px 20px;
    background:transparent;
    border:2px solid var(--accent);
    border-radius:12px;
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.explore-btn:hover{

    background:var(--accent);
    color:white;
}

.popup-overlay{

    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.popup-box{

    width:90%;
    max-width:500px;
    background:var(--card);
    color:var(--text);
    padding:30px;
    border-radius:20px;
    box-shadow:var(--cardShadow);
}

.checkout-item{

    display:flex;
    justify-content:space-between;
    margin-top:12px;
    padding:10px 0;
}

.popup-buttons{

    display:flex;
    gap:15px;
    margin-top:25px;
}

.confirm-btn,
.close-btn{

    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-weight:600;
}

.confirm-btn{
    background:#16a34a;
}

.close-btn{
    background:#ef4444;
}

.footer{

    text-align:center;
    padding:40px;
    color:var(--muted);
}

@media(max-width:768px){

    .navbar{

        grid-template-columns:1fr;
        gap:20px;
        text-align:center;
    }

    .theme-toggle{
        justify-content:center;
    }

    .hero-content h1{
        font-size:52px;
    }

    .hero-content p{
        font-size:16px;
    }

    .total-box{
        flex-direction:column;
        gap:15px;
    }
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">📚 RK</div>

    <div class="nav-center">

        <a class="active-nav" href="#">
            Home
        </a>

        <a href="#bookGridSection">
            Books
        </a>

        <a href="#cartSection">
            Cart
        </a>

    </div>

    <div class="theme-toggle">

        <span id="themeIcon">🌙</span>

        <label class="switch">

            <input
                type="checkbox"
                id="themeSwitch"
                onchange="toggleTheme()"
            >

            <span class="slider"></span>

        </label>

    </div>

</nav>

<section class="hero">

    <div class="hero-content">

        <h1>
            READORA KNOWLEDGE
        </h1>

        <p>
            Explore bestselling stories, powerful ideas and unforgettable adventures curated for passionate readers.
        </p>

    </div>

</section>

<section class="books-section" id="bookGridSection">

<div class="filters">

    <select id="genreFilter" onchange="filterBooks()">

        <option value="All">All Genres</option>
        <option value="Self Help">Self Help</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Mystery">Mystery</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Adventure">Adventure</option>

    </select>

    <select id="priceFilter" onchange="filterBooks()">

        <option value="All">All Prices</option>
        <option value="500">Below ₹500</option>
        <option value="700">Below ₹700</option>
        <option value="1000">Below ₹1000</option>

    </select>

</div>

<div class="book-grid" id="bookGrid"></div>

</section>

<section class="cart-section" id="cartSection">

<div class="cart-box">

    <div class="cart-header">

        <h2>🛒 Your Cart</h2>

        <div class="cart-count" id="cartCount">
            0 Items
        </div>

    </div>

    <div id="cartItems"></div>

    <div class="total-box">

        <h3 id="totalPrice">
            Total : ₹0
        </h3>

        <div style="display:flex; gap:12px; flex-wrap:wrap;">

            <button
                class="explore-btn"
                onclick="goToBooks()"
            >
                Explore More
            </button>

            <button
                class="checkout-btn"
                onclick="openCheckout()"
            >
                Checkout
            </button>

        </div>

    </div>

</div>

</section>

<div class="footer">
    Built with ☕ and dangerously high screen time.
</div>

<div class="popup-overlay" id="popupOverlay">

    <div class="popup-box">

        <h2>
            📚 Checkout Summary
        </h2>

        <div id="checkoutItems"></div>

        <h3 id="checkoutTotal">
            Total : ₹0
        </h3>

        <div class="popup-buttons">

            <button
                class="confirm-btn"
                onclick="confirmOrder()"
            >
                Confirm Order
            </button>

            <button
                class="close-btn"
                onclick="closePopup()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>

<script>

let cart = [];
let allBooks = [

{
    id:1,
    title:"Atomic Habits",
    genre:"Self Help",
    price:500
},
{
    id:2,
    title:"Ikigai",
    genre:"Self Help",
    price:350
},
{
    id:3,
    title:"Deep Work",
    genre:"Self Help",
    price:450
},
{
    id:4,
    title:"The Power of Now",
    genre:"Self Help",
    price:1400
},
{
    id:5,
    title:"Think Like a Monk",
    genre:"Self Help",
    price:550
},

{
    id:6,
    title:"The Hobbit",
    genre:"Fantasy",
    price:650
},
{
    id:7,
    title:"Harry Potter",
    genre:"Fantasy",
    price:700
},
{
    id:8,
    title:"Percy Jackson",
    genre:"Fantasy",
    price:600
},
{
    id:9,
    title:"Game of Thrones",
    genre:"Fantasy",
    price:1850
},
{
    id:10,
    title:"The Name of the Wind",
    genre:"Fantasy",
    price:750
},

{
    id:11,
    title:"Sherlock Holmes",
    genre:"Mystery",
    price:450
},
{
    id:12,
    title:"Gone Girl",
    genre:"Mystery",
    price:500
},
{
    id:13,
    title:"The Silent Patient",
    genre:"Mystery",
    price:620
},
{
    id:14,
    title:"Murder on the Orient Express",
    genre:"Mystery",
    price:1580
},
{
    id:15,
    title:"The Girl with the Dragon Tattoo",
    genre:"Mystery",
    price:720
},

{
    id:16,
    title:"Dune",
    genre:"Sci-Fi",
    price:800
},
{
    id:17,
    title:"Foundation",
    genre:"Sci-Fi",
    price:650
},
{
    id:18,
    title:"Neuromancer",
    genre:"Sci-Fi",
    price:700
},
{
    id:19,
    title:"The Martian",
    genre:"Sci-Fi",
    price:550
},
{
    id:20,
    title:"Ready Player One",
    genre:"Sci-Fi",
    price:1600
},

{
    id:21,
    title:"Treasure Island",
    genre:"Adventure",
    price:500
},
{
    id:22,
    title:"The Call of the Wild",
    genre:"Adventure",
    price:1450
},
{
    id:23,
    title:"Life of Pi",
    genre:"Adventure",
    price:620
},
{
    id:24,
    title:"Into the Wild",
    genre:"Adventure",
    price:580
},
{
    id:25,
    title:"Journey to the Center of the Earth",
    genre:"Adventure",
    price:700
}
];

function loadBooks(){

    displayBooks(allBooks);
}

function displayBooks(books){

    let container =
        document.getElementById("bookGrid");

    container.innerHTML = "";

    books.forEach(book => {

        let div = document.createElement("div");

        div.classList.add("book-card");

        div.innerHTML = `

            <img src="https://picsum.photos/300/400?random=${book.id}">

            <div class="book-content">

                <div class="genre">
                    ${book.genre}
                </div>

                <h3>${book.title}</h3>

                <p>
                    Discover immersive storytelling and unforgettable adventures.
                </p>

                <div class="price">
                    ₹${book.price}
                </div>

                <button
                    class="add-btn"
                    onclick='addToCart(${JSON.stringify(book)})'
                >
                    Add
                </button>

            </div>
        `;

        container.appendChild(div);
    });
}

function filterBooks(){

    let genre =
        document.getElementById("genreFilter").value;

    let price =
        document.getElementById("priceFilter").value;

    let filteredBooks = allBooks.filter(book => {

        let genreMatch =
            genre === "All" || book.genre === genre;

        let priceMatch =
            price === "All" ||
            book.price <= Number(price);

        return genreMatch && priceMatch;
    });

    displayBooks(filteredBooks);
}

function addToCart(book){

    cart.push(book);

    renderCart();

    document.getElementById("cartSection")
        .scrollIntoView({
            behavior:"smooth"
        });
}

function renderCart(){

    let cartBox =
        document.getElementById("cartItems");

    let total = 0;

    cartBox.innerHTML = "";

    cart.forEach((item,index) => {

        total += item.price;

        let div = document.createElement("div");

        div.classList.add("cart-item");

        div.innerHTML = `

            <div class="cart-left">

                <h4>${item.title}</h4>

                <p>${item.genre}</p>

            </div>

            <div class="qty-controls">

                <span>₹${item.price}</span>

                <button
                    class="qty-btn"
                    onclick="removeItem(${index})"
                >
                    -
                </button>

            </div>
        `;

        cartBox.appendChild(div);
    });

    document.getElementById("cartCount")
        .innerText = cart.length + " Items";

    document.getElementById("totalPrice")
        .innerText = "Total : ₹" + total;
}

function removeItem(index){

    cart.splice(index,1);

    renderCart();
}

function openCheckout(){

    if(cart.length === 0){

        return;
    }

    let checkoutItems =
        document.getElementById("checkoutItems");

    let checkoutTotal =
        document.getElementById("checkoutTotal");

    checkoutItems.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

        total += item.price;

        let div = document.createElement("div");

        div.classList.add("checkout-item");

        div.innerHTML = `

            <span>${item.title}</span>

            <span>₹${item.price}</span>
        `;

        checkoutItems.appendChild(div);
    });

    checkoutTotal.innerText =
        "Total : ₹" + total;

    document.getElementById("popupOverlay")
        .style.display = "flex";
}

function closePopup(){

    document.getElementById("popupOverlay")
        .style.display = "none";
}

function confirmOrder(){

    let popupBox =
        document.querySelector(".popup-box");

    popupBox.innerHTML = `

        <div style="text-align:center; padding:20px;">

            <h1 style="
                font-size:60px;
                margin-bottom:15px;
            ">
                ✔
            </h1>

            <h2 style="
                margin-bottom:15px;
            ">
                Order Confirmed!
            </h2>

            <p style="
                color:var(--muted);
                line-height:1.7;
                margin-bottom:25px;
            ">
                Your books are on their way 🏍🐱‍🏍
                Thank you for shopping with
                Readora Knowledge.
            </p>

            <button
                class="confirm-btn"
                onclick="closeConfirmedPopup()"
            >
                Continue Reading
            </button>

        </div>
    `;

    cart = [];

    renderCart();
}

function closeConfirmedPopup(){

    document.getElementById("popupOverlay")
        .style.display = "none";

    location.reload();
}

function goToBooks(){

    document.getElementById("bookGridSection")
        .scrollIntoView({
            behavior:"smooth"
        });
}

function toggleTheme(){

    document.body.classList.toggle("dark-theme");

    let icon =
        document.getElementById("themeIcon");

    if(document.body.classList.contains("dark-theme")){

        icon.innerText = "☀️";

        localStorage.setItem("theme","dark");

    }else{

        icon.innerText = "🌙";

        localStorage.setItem("theme","light");
    }
}

window.onload = function(){

    let savedTheme =
        localStorage.getItem("theme");

    if(savedTheme === "dark"){

        document.body.classList.add("dark-theme");

        document.getElementById("themeSwitch")
            .checked = true;

        document.getElementById("themeIcon")
            .innerText = "☀️";
    }

    loadBooks();
}

</script>

</body>
</html>
